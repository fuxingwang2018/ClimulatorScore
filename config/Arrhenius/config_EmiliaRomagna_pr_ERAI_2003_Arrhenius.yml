  HCLIM 12km pr: "/nobackup/proj/disk/hclimai/shared/Emilia_Romagna/cropped/${GCM}/12km/6hr/pr/pr_12km_6hr_${FIRST_YEAR_12km}01010300-${LAST_YEAR_12km}12312100.nc"
