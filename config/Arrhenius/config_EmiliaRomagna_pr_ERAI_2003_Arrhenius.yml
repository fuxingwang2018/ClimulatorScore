GCM: "ECMWF-ERAINT"
FIRST_YEAR_12km: "2000"
LAST_YEAR_12km: "2009"
FIRST_YEAR_3km: "2000"
LAST_YEAR_3km: "2009"

variables: 
  - "pr"

experiment: "SRGAN_WTWOROG_ERAI_2003"
MLEXP: ''

data_path:
