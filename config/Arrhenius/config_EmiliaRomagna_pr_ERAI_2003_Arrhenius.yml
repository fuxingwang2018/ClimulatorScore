  HCLIM 3km:  {'pr': {'start_date': ["2000-01-01 00:00"], 'end_date': ["2009-12-31 24:00"], 'step_hours': 6}, }
  #SRGAN 3km:  {'pr': {'start_date': ["2003-01-01 00:00"], 'end_date': ["2003-12-31 24:00"], 'step_hours': 6}, }
  SRGAN 3km:  {'pr': {'start_date': ["2003-01-01 00:00"], 'end_date': ["2003-12-31 24:00"], 'step_hours': 6}, }
  target: {'start_date': ["2003-01-01 00:00"], 'end_date': ["2003-12-31 24:00"], 'step_hours': 6}

output_dir: "${base_dir}/statistic_figs/1var/paper_revision1" 

statistics:
  - rmse
  - correlation
  - mean_bias
  - percentile_99_bias
  #- significance_pvalue
  - variance_ratio
  - wasserstein
  - percentile_99
  - mean_value
  - abs_value
  #- std

