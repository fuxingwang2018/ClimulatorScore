base_dir: "/nobackup/rossby26/users/sm_fuxwa/AI/Test_Domain"
GCM: "ECMWF-ERAINT"
FIRST_YEAR_12km: "2000"
LAST_YEAR_12km: "2009"
FIRST_YEAR_3km: "2000"
LAST_YEAR_3km: "2009"

variables: 
  - "tas"
#"tas" "hfls" "mrsol"

experiment: "SRGAN_tas_test"
MLEXP: ''

data_path:
  #HCLIM 3km: "${base_dir}/SG/SRGAN_OUT/EPOCH100_tas_no_pr/predictant_ytest.nc"
  #HCLIM 12km: "${base_dir}/SG/SRGAN_OUT/EPOCH1_tas_with_tas/predictor.nc"
  HCLIM 3km tas: "${base_dir}/${GCM}/3km/6hr/tas/tas_3km_6hr_${FIRST_YEAR_3km}01010000-${LAST_YEAR_3km}12311800.nc"
  HCLIM 12km tas: "${base_dir}/${GCM}/12km/6hr/tas/tas_12km_6hr_${FIRST_YEAR_12km}01010000-${LAST_YEAR_12km}12311800.nc"
  SRGAN 3km tas: "${base_dir}/SG/SRGAN_OUT/EPOCH100_tas_bs100_ERAI_atos/predictant_ypred_1.nc"

time_range:
  HCLIM 12km: {'tas': {'start_date': ["2000-01-01 00:00"], 'end_date': ["2009-12-31 24:00"], 'step_hours': 6}, }
  HCLIM 3km:  {'tas': {'start_date': ["2000-01-01 00:00"], 'end_date': ["2009-12-31 24:00"], 'step_hours': 6}, }
  SRGAN 3km:  {'tas': {'start_date': ["2009-01-01 00:00"], 'end_date': ["2009-12-31 24:00"], 'step_hours': 6}, }
  target: {'start_date': ["2009-01-01 00:00"], 'end_date': ["2009-12-31 24:00"], 'step_hours': 6}

output_dir: "${base_dir}/statistic_figs/1var" 

statistics:
  - rmse
  - correlation
  - mean_bias
  - variance_ratio
  - wasserstein
  - percentile_99
  - mean_value
  - abs_value
  #- std

min_max_scale:
  'rmse': 
  'correlation': [0.88, 1.00]
  'mean_bias':
  'variance_ratio':
  'wasserstein':
  'percentile_99': 
  'mean_value':
  'abs_value':
  #'std':

abs_value_max_scale:
  'pr': 0.5
  'tas': 1.0
  'mrsol': 1.0
  'hfls': 1.0

unit_convert:
  'pr': 86400.0
  'tas': 1.0
  'mrsol': 1.0
  'hfls': 1.0

fig_parameters:
  'nrows_def': 5
  'ncols_def': 5
  'figsize_def': [35,20]
  'fontsize_def': 18
  'nlevels_def': 11
  'extend_def': 'neither'
